name: Bruno API Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Create .env file for Docker Compose
        run: |
          cat > Docker/.env << EOF
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
          NODE_ENV=production
          EOF

      - name: Start services with Docker Compose
        run: docker compose --env-file Docker/.env -f Docker/docker-compose.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for database to be ready..."
          timeout 120s bash -c 'until [ "$(docker inspect --format='\''{{.State.Health.Status}}'\'' nb-server-db)" == "healthy" ]; do echo "DB Status: $(docker inspect --format='\''{{.State.Health.Status}}'\'' nb-server-db)"; sleep 5; done'
          echo "✅ Database is healthy!"
          
          echo "Waiting for application to be ready (migrations may take up to 3 minutes)..."
          for i in {1..40}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nb-server-app)
            echo "App Status: $STATUS (attempt $i/40)"
            
            if [ "$STATUS" == "healthy" ]; then
              echo "✅ Application is healthy!"
              break
            fi
            
            if [ "$STATUS" == "unhealthy" ] && [ $i -gt 10 ]; then
              echo "⚠️ Application unhealthy, showing logs..."
              docker compose -f Docker/docker-compose.yml logs app --tail 50
            fi
            
            sleep 5
          done
          
          # Final check
          STATUS=$(docker inspect --format='{{.State.Health.Status}}' nb-server-app)
          if [ "$STATUS" != "healthy" ]; then
            echo "❌ Application failed to become healthy"
            docker compose -f Docker/docker-compose.yml logs app
            exit 1
          fi
          
          echo "Verifying application endpoint..."
          curl -f http://localhost:8000/health || (echo "Health check endpoint failed, trying root..."; curl -f http://localhost:8000)
          echo "✅ Application is responding!"

      - name: Run Bruno API tests
        run: |
          bru run --env Dev --output results.json --format json --reporter-junit results.xml --reporter-html results.html
        working-directory: ./bruno

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-test-results
          path: |
            bruno/results.json
            bruno/results.xml
            bruno/results.html

      - name: Show application logs on failure
        if: failure()
        run: docker compose -f Docker/docker-compose.yml logs

      - name: Stop Docker Compose services
        if: always()
        run: docker compose -f Docker/docker-compose.yml down -v

      - name: Publish test results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: bruno/results.xml
          check_name: Bruno API Test Results
        continue-on-error: true
