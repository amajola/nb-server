name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: deno install --allow-scripts

      - name: Setup PostgreSQL
        run: |
          sudo -u postgres psql -c "CREATE ROLE ${{ secrets.POSTGRES_USER }} WITH SUPERUSER LOGIN PASSWORD '${{ secrets.POSTGRES_PASSWORD }}';" || true

      - name: Setup environment variables
        run: |
          cat << EOF > .env
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL=http://localhost:8000
          NODE_ENV=test
          EOF

      - name: Run database migrations
        run: |
          deno task generate
          deno task migrate

      - name: Start application in background
        run: |
          deno task start &
          echo $! > app.pid

      - name: Wait for application to be ready
        run: |
          timeout 30 sh -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 1; done' || \
          timeout 30 sh -c 'until curl -f http://localhost:8000 2>/dev/null; do sleep 1; done'

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno tests
        run: bru run --env Dev bruno/
        env:
          BRUNO_BASE_URL: http://localhost:8000

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
            rm app.pid
          fi
