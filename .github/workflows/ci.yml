name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Bruno Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install Deno dependencies
        run: deno install --allow-scripts

      - name: Create PostgreSQL user
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE ${{ secrets.POSTGRES_USER }} WITH SUPERUSER LOGIN PASSWORD '${{ secrets.POSTGRES_PASSWORD }}';" || echo "User already exists"

      - name: Setup environment variables
        run: |
          cat << EOF > .env
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL=http://localhost:8000
          NODE_ENV=test
          EOF

      - name: Generate database schema
        run: deno task generate

      - name: Run database migrations
        run: deno task migrate

      - name: Start application server
        run: |
          deno task start > app.log 2>&1 &
          echo $! > app.pid
          sleep 2

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:8000 2>/dev/null || curl -f http://localhost:8000/health 2>/dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 1
          done
          echo "Server failed to start. Logs:"
          cat app.log
          exit 1

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno API tests
        run: bru run --env Dev bruno/

      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: app.log
          retention-days: 7

      - name: Stop application server
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) 2>/dev/null || true
            rm app.pid
          fi
